<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Pont TikTok</title></head>
<body style="font-family:sans-serif;background:#111;color:#eee;padding:20px">
<p id="s">Chargement de la vidéo…</p>
<script>
// Récupère une vidéo de /media et l'envoie à l'onglet TikTok Studio qui a ouvert cette page.
(async () => {
  const s = document.getElementById('s');
  const f = new URLSearchParams(location.search).get('f');
  try {
    if (!/^[\w.-]+\.mp4$/.test(f || '')) throw new Error('nom de fichier invalide');
    if (!window.opener) throw new Error("pas d'onglet TikTok relié");
    const buf = await (await fetch('media/' + f)).arrayBuffer();
    window.opener.postMessage({tt_bridge: true, name: f, buf}, 'https://www.tiktok.com', [buf]);
    s.textContent = 'Vidéo envoyée à TikTok (' + f + '). Cet onglet peut être fermé.';
    setTimeout(() => window.close(), 1500);
  } catch (e) { s.textContent = 'Erreur : ' + e.message; }
})();
</script></body></html>
