name: Prototype « L'action qui a tout changé »

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            sudo dpkg --configure -a || true
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - run: pip install -r requirements.txt
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb
        run: python -m action.main --out docs/proto
      - run: |
          git config user.name "proto-bot"
          git config user.email "proto-bot@users.noreply.github.com"
          git add docs/proto/action_*.mp4 docs/proto/action_*.jpg && git commit -m "Prototype action" && git pull --rebase -q && git push
