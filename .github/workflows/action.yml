name: Vidéo « L'action qui a tout changé »

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Épisode JSON (action/episodes/...)"
        default: "action/episodes/ray_allen_2013.json"
      queue_at:
        description: "Programmer la publication : AAAA-MM-JJ HH:MM (vide = simple aperçu)"
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            sudo dpkg --configure -a || true
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - run: pip install -r requirements.txt
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m action.main --episode "${{ inputs.episode }}" --out docs/proto ${{ inputs.queue_at && format('--queue-at "{0}"', inputs.queue_at) || '' }}
      - run: |
          git config user.name "proto-bot"
          git config user.email "proto-bot@users.noreply.github.com"
          if [ -n "${{ inputs.queue_at }}" ]; then rm -rf docs/proto; git add -A publish/queue.json docs/media; else git add docs/proto/action_*.mp4 docs/proto/action_*.jpg; fi
          git commit -m "Action : vidéo" && git pull --rebase -q && git push
