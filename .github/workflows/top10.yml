name: Vidéo spéciale (10 trucs fous)

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "a ou b"
        default: "a"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et les emojis
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji && exit 0
            sleep 10
          done
          exit 1
      - run: pip install -r requirements.txt
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb
        run: python -m top10.main --out docs/proto --episode "${{ inputs.episode }}"
      - run: |
          git config user.name "proto-bot"
          git config user.email "proto-bot@users.noreply.github.com"
          rm -f docs/proto/video.mp4; git add docs/proto/*.mp4 docs/proto/*.jpg && git commit -m "Vidéo spéciale" && git pull --rebase -q && git push
