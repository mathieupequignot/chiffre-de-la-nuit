name: Vidéo spéciale (10 trucs fous)

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "a, b, ou chemin d'un épisode JSON (top10/episodes/...)"
        default: "a"
      queue_at:
        description: "Programmer la publication : AAAA-MM-JJ HH:MM (vide = simple aperçu)"
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et les emojis
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji && exit 0
            sleep 10
          done
          exit 1
      - run: pip install -r requirements.txt
      - env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m top10.main --out docs/proto --episode "${{ inputs.episode }}" ${{ inputs.queue_at && format('--queue-at "{0}"', inputs.queue_at) || '' }}
      - run: |
          git config user.name "proto-bot"
          git config user.email "proto-bot@users.noreply.github.com"
          rm -f docs/proto/video.mp4
          if [ -n "${{ inputs.queue_at }}" ]; then rm -rf docs/proto; git add -A publish/queue.json docs/media; else git add docs/proto/*.mp4 docs/proto/*.jpg; fi && git commit -m "Vidéo spéciale" && git pull --rebase -q && git push
