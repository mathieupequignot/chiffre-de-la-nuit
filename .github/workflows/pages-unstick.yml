name: Débloquer GitHub Pages

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit du déploiement bloqué"
        required: true

permissions:
  pages: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}/cancel" || true
          gh api "repos/${{ github.repository }}/pages/deployments/${{ inputs.sha }}" || true
