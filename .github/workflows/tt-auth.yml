name: Connexion TikTok

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code affiché sur la page callback après l'autorisation TikTok"
        required: true

permissions:
  contents: write

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: python -c "import os; from publish import tiktok; print('Compte TikTok connecté :', tiktok.exchange(os.environ['CODE']))"
      - run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add publish/tt_token.enc && git commit -m "TikTok : jeton (chiffré)" && git pull --rebase -q && git push
