name: Chiffre de la nuit

on:
  schedule:
    - cron: "30 6 * * *"   # 7h30 heure de Paris (hiver), 8h30 (été)
  workflow_dispatch:
    inputs:
      date:
        description: "Jour à traiter (AAAA-MM-JJ), vide = aujourd'hui"
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Fabriquer et envoyer la vidéo
        env:
          API_NBA_KEY: ${{ secrets.API_NBA_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb  # voix « Mathieu NBA » (clone validé le 9 nov.)
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          AUTO_PUBLISH: ${{ (secrets.IG_TOKEN != '' || secrets.YT_REFRESH_TOKEN != '') && '1' || '0' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -m chiffre.main --date "${{ inputs.date }}"; else python -m chiffre.main; fi
      - name: Garder une copie de la vidéo (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 7
      - name: Mettre en file pour la publication auto
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A publish/queue.json docs/media 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publication : chiffre en file" && git pull --rebase -q && git push
          fi
      - name: Prévenir sur Discord en cas d'échec
        if: failure() || cancelled()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
            -d '{"content":"⚠️ Le chiffre de la nuit : la génération a échoué ce matin. Je relance ou je regarde dès que tu me le dis."}' > /dev/null
