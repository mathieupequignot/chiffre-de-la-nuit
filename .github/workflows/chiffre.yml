name: Chiffre de la nuit

on:
  schedule:
    - cron: "47 5 * * *"   # passage anticipé (GitHub a souvent ~1 h de retard le matin) : ne fait rien si un match est encore en cours
    - cron: "30 6 * * *"   # 7h30 heure de Paris (hiver), 8h30 (été)
    - cron: "10 7 * * *"   # filet de sécurité si GitHub a sauté le premier passage (ignoré si déjà fait)
  workflow_dispatch:
    inputs:
      date:
        description: "Jour à traiter (AAAA-MM-JJ), vide = aujourd'hui"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: chiffre
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Déjà fait aujourd'hui ?
        if: github.event_name == 'schedule'
        run: |
          d=$(TZ=Europe/Paris date +%F)
          if grep -q "\"chiffre_$d\"" publish/queue.json; then echo "Chiffre du $d déjà en file : rien à faire"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        if: env.SKIP != '1'
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - name: Installer les dépendances
        if: env.SKIP != '1'
        run: pip install -r requirements.txt
      - name: Fabriquer et envoyer la vidéo
        if: env.SKIP != '1'
        env:
          API_NBA_KEY: ${{ secrets.API_NBA_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb  # voix « Mathieu NBA » (clone validé le 9 nov.)
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          CHIFFRE_EARLY: ${{ github.event.schedule == '47 5 * * *' && '1' || '0' }}
          AUTO_PUBLISH: ${{ (secrets.IG_TOKEN != '' || secrets.YT_REFRESH_TOKEN != '') && '1' || '0' }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then python -m chiffre.main --date "${{ inputs.date }}"; else python -m chiffre.main; fi
      - name: Garder une copie de la vidéo (7 jours)
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: |
            out/*.mp4
            out/*.jpg
          retention-days: 7
      - name: Mettre en file pour la publication auto
        if: always() && env.SKIP != '1'
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A publish/queue.json docs/media 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publication : chiffre en file" && git pull --rebase -q && git push
          fi
      - name: Lancer la publication tout de suite (brouillon TikTok sans attendre le prochain passage)
        if: success() && env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main || true
      - name: Prévenir sur Discord en cas d'échec
        if: failure() || cancelled()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
            -d '{"content":"⚠️ Le chiffre de la nuit : la génération a échoué ce matin. Je relance ou je regarde dès que tu me le dis."}' > /dev/null
