name: Vérifier les parcours (Wikipédia)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python quiz/tools/wiki_careers.py
      - name: Enregistrer
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add quiz/wiki_careers.json
          git commit -m "Parcours Wikipédia" && git pull --rebase -q && git push
