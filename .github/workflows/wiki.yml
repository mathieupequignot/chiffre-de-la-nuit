name: Vérifier les parcours (Wikipédia)

on:
  workflow_dispatch:
    inputs:
      src:
        description: "Fichier de joueurs (dans quiz/)"
        default: "players.json"
      dst:
        description: "Fichier de sortie (dans quiz/)"
        default: "wiki_careers.json"

permissions:
  contents: write

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python quiz/tools/wiki_careers.py "quiz/${{ inputs.src }}" "quiz/${{ inputs.dst }}"
      - name: Enregistrer
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add "quiz/${{ inputs.dst }}"
          git commit -m "Parcours Wikipédia" && git pull --rebase -q && git push
