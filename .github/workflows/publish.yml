name: Publication auto (Instagram, YouTube)

on:
  schedule:
    - cron: "5,35 6-22 * * *"   # toutes les 30 min de 7h à 23h (heure de Paris, hiver)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Publier ce qui est prêt
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m publish.run
      - name: Enregistrer la file d'attente
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish-bot@users.noreply.github.com"
          git add -A publish/queue.json docs/media
          if ! git diff --cached --quiet; then
            git commit -m "Publication : file d'attente" && git pull --rebase -q && git push
          fi
