name: Exercice de la semaine (Playground Lab)

on:
  schedule:
    - cron: "17 9 * * *"   # tous les jours ~10h Paris : exercice du jour publié à 18:00 (Facebook ; + Instagram/YouTube/TikTok le jeudi et le dimanche)
  workflow_dispatch:
    inputs:
      drill:
        description: "Drill (pound, crossover… ou next = le suivant de la liste)"
        default: "next"
      queue_at:
        description: "Programmer : AAAA-MM-JJ HH:MM (vide = simple aperçu, aucune publication)"
        required: false
      platforms:
        description: "Plateformes (facebook = Facebook seul ; vide = toutes)"
        required: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg et les emojis
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji && exit 0
            sleep 10
          done
          exit 1
      - run: pip install -r requirements.txt
      - name: Vidéo
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          DRILL="${{ inputs.drill || 'next' }}"
          AT="${{ inputs.queue_at }}"
          PLAT="${{ inputs.platforms }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            AT="$(TZ=Europe/Paris date +%F) 18:00"
            DOW=$(TZ=Europe/Paris date +%u)   # 4 = jeudi, 7 = dimanche : tous les comptes ; sinon Facebook seul
            if [ "$DOW" = "4" ] || [ "$DOW" = "7" ]; then PLAT=""; else PLAT="facebook"; fi
          fi
          if [ -n "$AT" ]; then
            python -m drill.main --out out_drill --drill "$DRILL" --queue-at "$AT" --platforms "$PLAT"
          else
            python -m drill.main --out docs/proto --drill "$DRILL"
          fi
      - run: |
          git config user.name "drill-bot"
          git config user.email "drill-bot@users.noreply.github.com"
          rm -f docs/proto/*.wav
          git add -A publish/queue.json docs/media drill/state.json docs/proto/drill_* 2>/dev/null || true
          git commit -m "Exercice de la semaine" && git pull --rebase -q && git push || echo "rien à publier"
