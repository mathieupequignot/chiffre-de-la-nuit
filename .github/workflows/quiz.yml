name: Quiz joueur

on:
  schedule:
    - cron: "40 6 * * *"   # 7h40 heure de Paris (hiver), 8h40 (été)
  workflow_dispatch:
    inputs:
      player:
        description: "Test : un seul quiz pour ce joueur (nom ou identifiant), vide = les 3 quiz du jour"
        required: false
      queue_at:
        description: "Avec player : publier automatiquement à HH:MM (Paris) au lieu d'envoyer sur Discord"
        required: false
      format:
        description: "Format du quiz (v1 ou v2)"
        default: "v2"

permissions:
  contents: write
  actions: write

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version de la file (pas celle du moment où le passage a été demandé)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            timeout 150 sudo apt-get update -o Acquire::Retries=3 && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Fabriquer et envoyer les quiz
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: qR7W98P3YFvanKmMWcIb  # voix « Mathieu NBA » (clone validé le 9 nov.)
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          AUTO_PUBLISH: ${{ (secrets.IG_TOKEN != '' || secrets.YT_REFRESH_TOKEN != '') && '1' || '0' }}
          QUIZ_FORMAT: ${{ inputs.format || 'v2' }}
        run: |
          if [ -n "${{ inputs.player }}" ]; then python -m quiz.main --player "${{ inputs.player }}" ${{ inputs.queue_at && format('--queue-at {0}', inputs.queue_at) || '' }}; else python -m quiz.main; fi
      - name: Enregistrer l'historique des joueurs et les voix
        if: always()
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          for p in quiz/used.json quiz/voice publish/queue.json docs/media; do git add -A "$p" 2>/dev/null || true; done
          if ! git diff --cached --quiet; then
            git commit -m "Quiz : historique du $(date +%F)"
            git pull --rebase -q && git push
          fi
      - name: Lancer la publication tout de suite (brouillon TikTok sans attendre le prochain passage)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main || true
      - name: Prévenir sur Discord en cas d'échec
        if: failure() || cancelled()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/$DISCORD_CHANNEL_ID/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
            -d '{"content":"⚠️ Les quiz : la génération a échoué ce matin. Je relance ou je regarde dès que tu me le dis."}' > /dev/null
