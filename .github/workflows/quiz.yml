name: Quiz joueur

on:
  schedule:
    - cron: "40 6 * * *"   # 7h40 heure de Paris (hiver), 8h40 (été)
  workflow_dispatch:
    inputs:
      player:
        description: "Test : un seul quiz pour ce joueur (nom ou identifiant), vide = les 3 quiz du jour"
        required: false

permissions:
  contents: write

concurrency:
  group: quiz
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Fabriquer et envoyer les quiz
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          if [ -n "${{ inputs.player }}" ]; then python -m quiz.main --player "${{ inputs.player }}"; else python -m quiz.main; fi
      - name: Enregistrer l'historique des joueurs et les voix
        if: always()
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add quiz/used.json quiz/voice 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Quiz : historique du $(date +%F)"
            git pull --rebase -q && git push
          fi
